<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إلى فطوكتي ❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="glow"></div>
<canvas id="fx"></canvas>
<audio id="au" src="1.mp3" loop preload="auto"></audio>

<section class="sc" id="intro"><div class="box" id="introBox"></div><button class="btn hid" id="enter">ادخلي... ❤️</button></section>

<section class="sc" id="music">
  <div class="ln big on">فطوكتي...<br>قبل لا نبدأ، شغلي الأغنية 🎵</div>
  <button class="btn pulse" id="play">شغلي الأغنية 🎵</button>
  <div class="bars" id="bigbars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</section>

<section class="sc" id="quiz"><div class="box" id="qBox"></div></section>
<section class="sc" id="chem"><div class="box" id="cBox"></div></section>
<section class="sc" id="eq"><div class="box" id="eBox"></div></section>

<section class="sc" id="time">
  <h2 class="ttl">من أول لحظة... إلى هسه ❤️</h2>
  <div id="tl"></div>
</section>

<section class="sc" id="heart">
  <canvas id="hc"></canvas>
  <div class="box low" id="hBox"></div>
  <button class="btn hid" id="toLetter">كملي ❤️</button>
</section>

<section class="sc" id="letter">
  <h2 class="ttl">إلى فطوكتي... من عبسبس ❤️</h2>
  <div class="card" id="card"></div>
  <button class="btn hid" id="toEnd">كملي ❤️</button>
</section>

<section class="sc" id="end"><div class="box" id="fBox"></div></section>

<div id="ctl" class="hid"><div class="bars mini" id="minibars"><i></i><i></i><i></i><i></i></div><button id="pp">❚❚</button></div>
<script src="script.js"></script>
</body>
</html>
